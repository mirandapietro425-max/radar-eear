kind = "web"
previewPath = "/"
title = "Radar EEAR"
description = "Plataforma de preparação para o CFS/EEAR da FAB, com painel de progresso, ciclo de estudos, questões, revisões e simulados focados na prova de Controle de Tráfego Aéreo."
version = "1.0.0"
id = "artifacts/radar-eear"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25215

[services.development]
run = "pnpm --filter @workspace/radar-eear run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/radar-eear", "run", "build" ]
serve = "static"
publicDir = "artifacts/radar-eear/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25215"
BASE_PATH = "/"
